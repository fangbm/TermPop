name: Bug report
description: Report a reproducible problem in TermPop
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TermPop. Please do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: TermPop version
      placeholder: e.g. v0.1.4
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Other Chromium-based browser
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove API keys, credentials, private page content, or other sensitive information before posting.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser version, extension install method, configured provider/model if relevant.
