name: Build Extension Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string
      publish_edge_addons:
        description: "Submit the package update to Microsoft Edge Add-ons"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-extension:
    name: Build and publish browser extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like v0.1.0; got '${version}'." >&2
            exit 1
          fi

          manifest_version="$(node -p "require('./extension/src/manifest.json').version")"
          package_version="$(node -p "require('./extension/package.json').version")"
          expected_version="${version#v}"

          if [ "${manifest_version}" != "${expected_version}" ]; then
            echo "Manifest version ${manifest_version} does not match ${version}." >&2
            exit 1
          fi

          if [ "${package_version}" != "${expected_version}" ]; then
            echo "Extension package version ${package_version} does not match ${version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "plain_version=${expected_version}" >> "$GITHUB_OUTPUT"

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build WASM core
        run: wasm-pack build crates/termpop-core --target web --out-dir ../../extension/src/wasm -- --features wasm

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Test extension
        working-directory: extension
        run: npm test

      - name: Audit all extension dependencies
        working-directory: extension
        run: npm audit --audit-level=high

      - name: Audit extension production dependencies
        working-directory: extension
        run: npm audit --omit=dev --audit-level=high

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package extension
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_name="termpop-extension-${{ steps.version.outputs.version }}.zip"
          mkdir -p artifacts
          if find extension/dist -type f \( -iname '*.zip' -o -iname '*.gz' -o -iname '*.rar' -o -iname '*.7z' -o -iname '*.br' \) -print -quit | grep -q .; then
            echo "Extension package cannot contain nested compressed files for Microsoft Edge Add-ons." >&2
            exit 1
          fi
          (cd extension/dist && zip -r "../../artifacts/${package_name}" .)
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_path=artifacts/${package_name}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          previous_tag="$(git tag --sort=-creatordate --merged HEAD --list 'v*' | grep -vx "${version}" | head -n 1 || true)"

          {
            echo "## TermPop ${version}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`${{ steps.package.outputs.package_name }}\`"
            echo
            echo "## Changes"
            echo
            if [ -n "${previous_tag}" ]; then
              git log --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
            else
              git log --pretty='- %s (`%h`)' --max-count=30
            fi
          } > release-notes.md

          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "release_name=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.package_path }}
          make_latest: true

      - name: Submit package to Microsoft Edge Add-ons
        if: >-
          vars.EDGE_ADDONS_PUBLISH_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.publish_edge_addons)
        env:
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for required in EDGE_ADDONS_PRODUCT_ID EDGE_ADDONS_CLIENT_ID EDGE_ADDONS_API_KEY; do
            if [ -z "${!required}" ]; then
              echo "Missing required GitHub secret: ${required}" >&2
              exit 1
            fi
          done

          api_root="https://api.addons.microsoftedge.microsoft.com/v1"
          headers=(
            -H "Authorization: ApiKey ${EDGE_ADDONS_API_KEY}"
            -H "X-ClientID: ${EDGE_ADDONS_CLIENT_ID}"
          )

          upload_headers="$(mktemp)"
          trap 'rm -f "${upload_headers}"' EXIT
          curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
          -H "Content-Type: application/zip" \
          -D "${upload_headers}" \
          -X POST \
          --upload-file "${PACKAGE_PATH}" \
          "${api_root}/products/${EDGE_ADDONS_PRODUCT_ID}/submissions/draft/package" >/dev/null

          upload_operation="$(awk 'tolower($1) == "location:" { print $2 }' "${upload_headers}" | tr -d '\r' | sed 's#.*/##' | tail -n 1)"
          if [ -z "${upload_operation}" ]; then
            echo "Edge Add-ons upload did not return an operation ID." >&2
            exit 1
          fi

          poll_operation() {
            local endpoint="$1"
            local operation="$2"
            local label="$3"
            local response status

            for _ in $(seq 1 60); do
              response="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${endpoint}/${operation}")"
              status="$(jq -r '.status // empty' <<<"${response}")"
              echo "Edge Add-ons ${label} status: ${status:-unknown}"
              case "${status}" in
                Succeeded) return 0 ;;
                Failed)
                  jq -c '{status, errorCode, message, errors}' <<<"${response}" >&2
                  return 1
                  ;;
              esac
              sleep 10
            done

            echo "Timed out waiting for Edge Add-ons ${label}." >&2
            return 1
          }

          poll_operation \
            "${api_root}/products/${EDGE_ADDONS_PRODUCT_ID}/submissions/draft/package/operations" \
            "${upload_operation}" \
            "package upload"

          publish_headers="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            -H "Content-Type: application/json" \
            -D "${publish_headers}" \
            --data "$(jq -cn --arg version "${RELEASE_VERSION}" '{notes: ("Automated TermPop release " + $version + ".") }')" \
            "${api_root}/products/${EDGE_ADDONS_PRODUCT_ID}/submissions" >/dev/null

          publish_operation="$(awk 'tolower($1) == "location:" { print $2 }' "${publish_headers}" | tr -d '\r' | sed 's#.*/##' | tail -n 1)"
          rm -f "${publish_headers}"
          if [ -z "${publish_operation}" ]; then
            echo "Edge Add-ons publish request did not return an operation ID." >&2
            exit 1
          fi

          poll_operation \
            "${api_root}/products/${EDGE_ADDONS_PRODUCT_ID}/submissions/operations" \
            "${publish_operation}" \
            "submission"
