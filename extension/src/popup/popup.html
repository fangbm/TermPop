<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermPop</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1 id="app-title">TermPop</h1>
        <p data-i18n="subtitle">AI 词汇解释助手</p>
      </header>
      <section class="mode-group" aria-label="检测模式" data-i18n-attr="aria-label:modeGroupLabel">
        <button type="button" data-mode="hover" data-label-zh="悬停" data-label-en="Hover">悬停</button>
        <button type="button" data-mode="selection" data-label-zh="划词" data-label-en="Selection">划词</button>
        <button type="button" data-mode="hybrid" data-label-zh="混合" data-label-en="Hybrid">混合</button>
      </section>
      <section class="site-access">
        <div>
          <strong data-i18n="currentSite">当前站点</strong>
          <p id="site-access-status">正在读取权限...</p>
        </div>
        <button id="site-access-toggle" type="button">在所有网站启用 TermPop</button>
      </section>
      <section class="pdf-tools">
        <button id="open-pdf-viewer" type="button">用 TermPop 打开当前 PDF</button>
        <p data-i18n="pdfToolsNote">适用于网页 PDF 或本地 PDF 文件。浏览器可能需要为插件开启“允许访问文件网址”。</p>
      </section>
      <form id="llm-form" class="settings-form">
        <label>
          <span data-i18n="provider">服务商</span>
          <select id="provider" name="provider">
            <option value="openai">OpenAI</option>
            <option value="kimi">Kimi</option>
            <option value="openai-compatible">OpenAI-compatible</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
        <label>
          API Key
          <input id="api-key" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <label>
          <span data-i18n="model">模型</span>
          <input id="model" name="model" type="text" placeholder="gpt-4.1-mini" />
        </label>
        <label>
          Base URL
          <input id="base-url" name="baseUrl" type="url" placeholder="https://api.openai.com/v1" />
        </label>
        <button id="provider-test" class="secondary-button" type="button" data-i18n="testProvider">测试连接</button>
        <p id="status" role="status"></p>
        <label>
          <span data-i18n="explanationLanguage">解释语言</span>
          <select id="language" name="language">
            <option value="auto" data-i18n="languageAuto">跟随上下文</option>
            <option value="zh-CN" data-i18n="languageChinese">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="checkbox-row">
          <input id="include-usage-example" name="includeUsageExample" type="checkbox" />
          <span data-i18n="includeUsageExample">生成例句</span>
        </label>
        <label class="checkbox-row">
          <input id="screenshot-recognition-enabled" name="screenshotRecognitionEnabled" type="checkbox" />
          <span data-i18n="screenshotRecognitionEnabled">启用截图解释</span>
        </label>
        <label>
          <span data-i18n="screenshotRecognitionMode">截图识别方式</span>
          <select id="screenshot-recognition-mode" name="screenshotRecognitionMode">
            <option value="auto" data-i18n="screenshotModeAuto">自动选择</option>
            <option value="multimodal" data-i18n="screenshotModeMultimodal">多模态 LLM</option>
            <option value="ocr" data-i18n="screenshotModeOcr">本地 OCR</option>
          </select>
        </label>
        <section class="shortcut-settings" aria-label="截图快捷键" data-i18n-attr="aria-label:screenshotShortcutLabel">
          <div>
            <span data-i18n="screenshotShortcutLabel">截图快捷键</span>
            <strong id="screenshot-shortcut">Alt+Shift+S</strong>
          </div>
          <button id="customize-shortcut" class="secondary-button" type="button" data-i18n="customizeShortcut">自定义快捷键</button>
        </section>
        <section class="site-resources" aria-label="TermPop resources" data-i18n-attr="aria-label:resourcesLabel">
          <div>
            <strong data-i18n="resourcesLabel">使用帮助</strong>
            <p data-i18n="resourcesNote">首次使用或遇到问题时，可打开官网新手向导和文档。</p>
          </div>
          <div class="site-resources-actions">
            <button id="open-guide" class="secondary-button" type="button" data-i18n="openGuide">打开新手向导</button>
            <button id="open-docs" class="secondary-button" type="button" data-i18n="openDocs">打开文档</button>
          </div>
        </section>
        <section class="ignored-terms" aria-label="Ignored automatic highlights" data-i18n-attr="aria-label:ignoredTerms">
          <div class="ignored-terms-header">
            <div>
              <strong data-i18n="ignoredTerms">已忽略词</strong>
              <p data-i18n="ignoredTermsNote">这些词不会再自动高亮。划词和截图解释不受影响。</p>
            </div>
            <button id="restore-all-ignored-terms" class="secondary-button" type="button" data-i18n="restoreAll">全部恢复</button>
          </div>
          <div id="ignored-terms-list" class="ignored-terms-list"></div>
        </section>
        <button id="advanced-toggle" class="secondary-button" type="button">高级设置</button>
        <section id="advanced-settings" class="advanced-settings" hidden>
          <div class="inline-fields">
            <label>
              <span data-i18n="temperature">温度</span>
              <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1" />
            </label>
            <label>
              Tokens
              <input id="max-tokens" name="maxTokens" type="number" min="128" max="4000" step="1" />
            </label>
          </div>
          <label>
            <span data-i18n="maxConcurrency">并发限制</span>
            <input id="max-concurrency" name="maxConcurrency" type="number" min="1" step="1" />
          </label>
        </section>
      </form>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
