<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TermPop layout safety regression</title>
    <style>
      body {
        margin: 40px;
        color: #172033;
        font: 22px/1.55 Arial, sans-serif;
      }

      .hostile-span-styles span {
        display: block !important;
        width: 100% !important;
        margin: 18px 0 !important;
        padding: 12px !important;
        font-size: 42px !important;
        line-height: 2 !important;
      }

      .flex-copy {
        display: flex;
        gap: 20px;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <p id="hostile" class="hostile-span-styles">
      Rust and React compile shared logic to WASM without changing this paragraph's line layout.
    </p>
    <div id="flex-copy" class="flex-copy">
      Rust inside a direct flex text child must remain untouched by automatic highlighting.
    </div>
  </body>
</html>
